<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Choose new password | Pizzarium</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,600;6..96,700;6..96,800;6..96,900&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="gold-black.css"><link rel="stylesheet" href="auth.css"></head><body class="auth-page"><main class="auth-shell"><a class="auth-back" href="sign-in.html">&larr; Sign in</a><a class="auth-brand" href="index.html"><span>&bull;</span>PIZZARIUM<small>pizza by adi</small></a><h1 class="auth-title">NEW<br>PASSWORD.</h1><p class="auth-intro" id="resetIntro">Choose a new password for your Pizzarium account.</p><form class="auth-form" id="newPasswordForm"><label>New password<input name="password" type="password" autocomplete="new-password" minlength="8" required></label><label>Confirm new password<input name="confirmPassword" type="password" autocomplete="new-password" minlength="8" required></label><button class="button modal-order auth-submit" type="submit">Update password <span>&rarr;</span></button></form><p class="auth-message" id="authMessage"></p></main><script src="auth.js"></script><script>const token=new URLSearchParams(location.hash.slice(1)).get('access_token'),form=document.querySelector('#newPasswordForm'),message=document.querySelector('#authMessage');if(!token){form.style.display='none';message.className='auth-message error';message.textContent='This reset link is invalid or has expired. Please request a new one.';}form.addEventListener('submit',async e=>{e.preventDefault();const b=e.currentTarget.querySelector('button'),d=new FormData(e.currentTarget);message.className='auth-message';message.textContent='';if(d.get('password')!==d.get('confirmPassword')){message.className='auth-message error';message.textContent='Passwords do not match.';return;}b.disabled=true;b.textContent='Updating password...';try{const response=await fetch(`${PizzariumAuth.url}/auth/v1/user`,{method:'PUT',headers:{apikey:PizzariumAuth.key,Authorization:`Bearer ${token}`,'Content-Type':'application/json'},body:JSON.stringify({password:d.get('password')})});if(!response.ok)throw new Error();message.textContent='Password updated successfully. Redirecting to sign in…';setTimeout(()=>location.href='sign-in.html',1200);}catch{message.className='auth-message error';message.textContent='This reset link is invalid or has expired. Please request a new one.';}finally{b.disabled=false;b.innerHTML='Update password <span>&rarr;</span>';}});</script></body></html>
