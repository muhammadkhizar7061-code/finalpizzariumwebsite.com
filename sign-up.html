<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Create account | Pizzarium</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,600;6..96,700;6..96,800;6..96,900&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="gold-black.css"><link rel="stylesheet" href="auth.css"></head>
<body class="auth-page"><main class="auth-shell"><a class="auth-back" href="index.html">&larr; Home</a><a class="auth-brand" href="index.html"><span>&bull;</span>PIZZARIUM<small>pizza by adi</small></a><h1 class="auth-title">CREATE<br>ACCOUNT.</h1><p class="auth-intro">Create an account to place, manage, and track your Pizzarium orders.</p><form class="auth-form" id="signUpForm"><label>Full name<input name="name" autocomplete="name" required></label><label>Mobile number<input name="phone" autocomplete="tel" required></label><label>Email address<input name="email" type="email" autocomplete="email" required></label><label>Password<input name="password" type="password" autocomplete="new-password" minlength="8" required></label><label>Confirm password<input name="confirmPassword" type="password" autocomplete="new-password" minlength="8" required></label><button class="button modal-order auth-submit" type="submit">Create account <span>&rarr;</span></button></form><p class="auth-message" id="authMessage"></p><p class="auth-switch">Already have an account? <a href="sign-in.html">Sign in</a></p></main><script src="auth.js"></script><script>document.querySelector('#signUpForm').addEventListener('submit',async e=>{e.preventDefault();const b=e.currentTarget.querySelector('button'),m=document.querySelector('#authMessage'),d=new FormData(e.currentTarget);m.className='auth-message';m.textContent='';if(d.get('password')!==d.get('confirmPassword')){m.className='auth-message error';m.textContent='Passwords do not match. Please enter the same password twice.';return;}b.disabled=true;b.textContent='Creating account...';try{const r=await PizzariumAuth.signUp({name:d.get('name'),phone:d.get('phone'),email:d.get('email'),password:d.get('password')});if(r.access_token){location.href='index.html';}else{m.textContent='Account created. Please check your email and confirm your account, then sign in.';}}catch(err){m.className='auth-message error';m.textContent=err.message;}finally{b.disabled=false;b.innerHTML='Create account <span>&rarr;</span>';}});</script></body></html>
