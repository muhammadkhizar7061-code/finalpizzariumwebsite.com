<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="View and manage your Pizzarium orders.">
  <title>My orders | Pizzarium</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,600;6..96,700;6..96,800;6..96,900&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="gold-black.css">
  <link rel="stylesheet" href="orders.css">
</head>
<body class="orders-page">
  <header class="orders-header">
    <a class="brand" href="index.html"><span class="brand-dot">&bull;</span>PIZZARIUM<small>pizza by adi</small></a>
    <nav><a href="index.html">Menu</a><a href="cart.html">Cart</a><a class="sign-out" href="#" id="ordersSignOut">Sign out</a></nav>
  </header>
  <main class="orders-main">
    <section class="orders-hero"><p class="eyebrow">Your Pizzarium account</p><h1>ORDER <em>HISTORY.</em></h1><p>Follow every order in one place. New and confirmed orders can be cancelled before kitchen preparation begins.</p></section>
    <section class="orders-toolbar"><p id="ordersStatus">Loading your orders…</p><button id="refreshHistory" type="button">Refresh <span>↻</span></button></section>
    <section class="customer-orders" id="customerOrders" aria-live="polite"></section>
    <button class="load-more" id="loadMoreOrders" type="button" hidden>Load older orders</button>
  </main>
  <div class="cancel-popup" id="cancelPopup" hidden><div class="cancel-backdrop"></div><section class="cancel-dialog" role="dialog" aria-modal="true" aria-labelledby="cancelTitle"><span>✦</span><h2 id="cancelTitle">CANCEL ORDER?</h2><p>This cannot be undone. The restaurant will be notified.</p><div><button type="button" id="keepOrder">Keep order</button><button type="button" id="confirmCancel">Cancel order</button></div></section></div>
  <script src="auth.js"></script>
  <script src="orders.js"></script>
</body>
</html>
