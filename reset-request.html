<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Reset password | Pizzarium</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,600;6..96,700;6..96,800;6..96,900&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="gold-black.css"><link rel="stylesheet" href="auth.css"></head><body class="auth-page"><main class="auth-shell"><a class="auth-back" href="sign-in.html">&larr; Sign in</a><a class="auth-brand" href="index.html"><span>&bull;</span>PIZZARIUM<small>pizza by adi</small></a><h1 class="auth-title">RESET<br>PASSWORD.</h1><p class="auth-intro">Enter your email address and we will send a secure password-reset link.</p><form class="auth-form" id="resetRequestForm"><label>Email address<input name="email" type="email" autocomplete="email" required></label><button class="button modal-order auth-submit" type="submit">Send reset link <span>&rarr;</span></button></form><p class="auth-message" id="authMessage"></p><p class="auth-switch">Remembered it? <a href="sign-in.html">Sign in</a></p></main><script src="auth.js"></script><script>document.querySelector('#resetRequestForm').addEventListener('submit',async e=>{e.preventDefault();const b=e.currentTarget.querySelector('button'),m=document.querySelector('#authMessage'),email=new FormData(e.currentTarget).get('email');b.disabled=true;b.textContent='Sending link...';m.className='auth-message';m.textContent='';try{await PizzariumAuth.requestPasswordReset(email,new URL('reset-password.html',location.href).href);m.textContent='If this email has a Pizzarium account, a password-reset link has been sent.';}catch(err){m.className='auth-message error';m.textContent='Unable to send the reset link. Please try again later.';}finally{b.disabled=false;b.innerHTML='Send reset link <span>&rarr;</span>';}});</script></body></html>
