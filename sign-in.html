<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Sign in | Pizzarium</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,600;6..96,700;6..96,800;6..96,900&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="gold-black.css"><link rel="stylesheet" href="auth.css"></head><body class="auth-page"><main class="auth-shell"><a class="auth-back" href="index.html">&larr; Home</a><a class="auth-brand" href="index.html"><span>&bull;</span>PIZZARIUM<small>pizza by adi</small></a><h1 class="auth-title">WELCOME<br>BACK.</h1><p class="auth-intro">Sign in to place an order directly with Pizzarium.</p><form class="auth-form" id="signInForm"><label>Email address<input name="email" type="email" autocomplete="email" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button class="button modal-order auth-submit" type="submit">Sign in <span>&rarr;</span></button></form><p class="auth-message" id="authMessage"></p><p class="auth-switch">New to Pizzarium? <a href="sign-up.html">Create an account</a></p></main><script src="auth.js"></script><script>document.querySelector('#signInForm').addEventListener('submit',async e=>{e.preventDefault();const b=e.currentTarget.querySelector('button'),m=document.querySelector('#authMessage'),d=new FormData(e.currentTarget);b.disabled=true;b.textContent='Signing in...';m.textContent='';try{const session=await PizzariumAuth.signIn({email:d.get('email'),password:d.get('password')});const role=await PizzariumAuth.getUserRole(session);location.href=['admin','staff'].includes(role)?'admin.html':'index.html';}catch(err){m.className='auth-message error';m.textContent=err.message;}finally{b.disabled=false;b.innerHTML='Sign in <span>&rarr;</span>';}});</script></body></html>
