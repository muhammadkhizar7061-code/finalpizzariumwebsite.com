<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Order Console | Pizzarium</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,600;6..96,700;6..96,800;6..96,900&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="gold-black.css"><link rel="stylesheet" href="admin.css"></head>
<body class="admin-page"><header class="admin-header"><a class="brand" href="index.html"><span class="brand-dot">&bull;</span>PIZZARIUM<small>pizza by adi</small></a><div class="admin-account"><span id="staffName">Order console</span><a href="#" id="adminSignOut">Sign out</a></div></header>
<main class="admin-main"><section class="admin-intro"><div><p class="eyebrow">Private staff area</p><h1>ORDER <em>CONSOLE.</em></h1><p>Monitor every Pizzarium order from one clean workspace.</p></div><button class="refresh-button" id="refreshOrders" type="button">Refresh <span>↻</span></button></section><section class="stat-grid"><article><span>New orders</span><strong id="newCount">0</strong></article><article><span>In progress</span><strong id="progressCount">0</strong></article><article><span>Completed today</span><strong id="completedCount">0</strong></article><article><span>Today’s sales</span><strong id="salesTotal">PKR 0</strong></article></section><section class="admin-controls"><div class="order-filters" id="orderFilters"><button class="active" data-filter="all">All orders</button><button data-filter="new">New</button><button data-filter="active">In progress</button><button data-filter="completed">Completed</button></div><p id="adminStatus">Loading orders…</p></section><section class="orders-list" id="ordersList"></section></main><script src="auth.js"></script><script src="admin.js"></script></body></html>
